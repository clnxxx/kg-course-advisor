<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI 流式对话测试</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .config-section {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .config-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .config-item {
            flex: 1;
            min-width: 200px;
        }

        .config-item label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }

        .config-item input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .config-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-container {
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 4px;
        }

        .message.typing .message-content {
            background: #f0f0f0;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .input-section {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .input-row input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e9ecef;
            border-radius: 24px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .input-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-row button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-row button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .input-row button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-bar {
            padding: 8px 20px;
            background: #f8f9fa;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-dot.connected {
            background: #38ef7d;
        }

        .status-dot.disconnected {
            background: #ff6b6b;
        }

        .status-dot.loading {
            background: #ffd93d;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Spring AI 流式对话测试</h1>
            <p>测试 OpenAI 兼容接口的流式输出能力</p>
        </div>

        <div class="config-section">
            <div class="config-row">
                <div class="config-item">
                    <label>API Base URL</label>
                    <input type="text" id="apiBase" value="http://localhost:8080" placeholder="例如: http://localhost:8080">
                </div>
                <div class="config-item">
                    <label>会话 ID</label>
                    <input type="text" id="sessionId" value="test-session-1" placeholder="会话标识符">
                </div>
                <div class="config-item">
                    <label>用户 ID</label>
                    <input type="text" id="userId" value="1" placeholder="用户ID">
                </div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-avatar">AI</div>
                    <div class="message-content">你好！我是你的 AI 助手。请输入消息开始对话，我会实时流式响应。👋</div>
                </div>
            </div>

            <div class="input-section">
                <div class="input-row">
                    <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
                    <button id="sendBtn" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <span><span class="status-dot loading" id="statusDot"></span><span id="statusText">正在检查连接...</span></span>
            <span id="streamStatus">就绪</span>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiBaseInput = document.getElementById('apiBase');
        const sessionIdInput = document.getElementById('sessionId');
        const userIdInput = document.getElementById('userId');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const streamStatus = document.getElementById('streamStatus');

        let currentAssistantContent = null;

        // 自动滚动到底部
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 添加消息到聊天界面
        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? '我' : 'AI';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);

            scrollToBottom();
            return contentDiv;
        }

        // 更新消息内容
        function updateMessage(contentDiv, content) {
            contentDiv.textContent = content;
            scrollToBottom();
        }

        // 发送消息
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // 添加用户消息
            addMessage('user', message);
            messageInput.value = '';

            // 创建助手消息占位
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = 'AI';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);

            currentAssistantContent = '';
            scrollToBottom();

            // 禁用按钮
            sendBtn.disabled = true;
            streamStatus.textContent = '正在连接...';

            const apiBase = apiBaseInput.value.replace(/\/$/, '');
            const url = `${apiBase}/api/chat/stream`;

            const requestBody = {
                message: message,
                sessionId: sessionIdInput.value || 'default',
                userId: parseInt(userIdInput.value) || 1
            };

            try {
                streamStatus.textContent = '正在请求...';

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                streamStatus.textContent = '正在流式接收...';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const decoded = decoder.decode(value, { stream: true });
                    buffer += decoded;
                    
                    // 处理 SSE 行
                    let lineEnd;
                    while ((lineEnd = buffer.indexOf('\n')) !== -1) {
                        const line = buffer.substring(0, lineEnd).trim();
                        buffer = buffer.substring(lineEnd + 1);
                        
                        if (line.startsWith('data:')) {
                            const data = line.substring(5); // 去掉 'data:'
                            if (data === '[DONE]') continue;
                            currentAssistantContent += data;
                            contentDiv.textContent = currentAssistantContent;
                            scrollToBottom();
                            streamStatus.textContent = `已接收 ${currentAssistantContent.length} 字符`;
                        }
                    }
                }

                streamStatus.textContent = '响应完成';

            } catch (error) {
                console.error('Error:', error);
                updateMessage(contentDiv, '抱歉，发生了错误: ' + error.message);
                streamStatus.textContent = '连接失败';
            } finally {
                sendBtn.disabled = false;
            }
        }

        // 更新连接状态显示
        function updateStatus(status, text) {
            statusDot.className = `status-dot ${status}`;
            statusText.textContent = text;
        }

        // 监听回车键发送消息
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 检查后端连接
        async function checkConnection() {
            try {
                const apiBase = apiBaseInput.value.replace(/\/$/, '');
                const url = `${apiBase}/api/chat/stream`;

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'test',
                        sessionId: 'test',
                        userId: 1
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (response.ok) {
                    updateStatus('connected', '后端服务正常');
                } else {
                    updateStatus('disconnected', '后端返回错误');
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    updateStatus('disconnected', '连接超时');
                } else {
                    updateStatus('disconnected', '后端服务未运行');
                }
            }
        }

        // 启动时检查连接
        checkConnection();
    </script>
</body>
</html>
