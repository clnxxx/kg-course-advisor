spring.application.name=kg-course-advisor

# ==================== MySQL Configuration ====================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/kg_course_advisor?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 事务管理器配置 - 指定 JPA 事务管理器为主
spring.main.allow-bean-definition-overriding=true
spring.data.neo4j.repositories.enabled=true

# ==================== Neo4j Configuration ====================
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}

# ==================== Spring AI OpenAI Configuration ====================
# Default to LM Studio local OpenAI-compatible endpoint.
# Override with environment variables when switching providers or models.
# Note: for Spring AI, base-url should be the provider root (for example https://api.siliconflow.cn),
# because the OpenAI chat API path already includes /v1/chat/completions by default.
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:lm-studio}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:http://127.0.0.1:1234}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:qwen3.5-sft-v1}
# Provider-specific top-level request fields can be injected with Spring Boot env binding, e.g.
# SPRING_AI_OPENAI_CHAT_OPTIONS_EXTRA_BODY_ENABLE_THINKING=false for SiliconFlow/Qwen base models.
app.agent.mode=${APP_AGENT_MODE:multi}

# ==================== JWT Configuration ====================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==================== Server Configuration ====================
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==================== Logging ====================
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.data.neo4j=DEBUG
logging.level.com.clnx.kg_course_advisor=DEBUG
logging.level.org.springframework.security=WARN

# ==================== Spring AI Chat Memory JDBC ====================
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
